<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIBOSSGEN | 網站開發與數位作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #F6F3EC;
      --sand: #EBE6DC;
      --card: #FFFFFF;
      --ink: #1C1917;
      --stone: #57534E;
      --forest: #1B4332;
      --forest-hover: #143326;
      --sage: #E7EFEA;
      --border: #DFD9CE;
      --danger: #991B1B;
      --radius-card: 16px;
      --radius-pill: 9999px;
      --font-serif: "Noto Serif TC", Georgia, serif;
      --font-sans: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 頂部導覽列 */
    .topbar {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--forest);
      flex-shrink: 0;
    }

    /* 按鈕樣式（膠囊圓角） */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--sand);
      border-color: #CFC7B8;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-forest {
      background-color: var(--forest);
      border-color: var(--forest);
      color: #FFFFFF;
    }

    .btn-forest:hover:not(:disabled) {
      background-color: var(--forest-hover);
      border-color: var(--forest-hover);
      color: #FFFFFF;
    }

    .btn-subtle {
      background-color: transparent;
      border-color: var(--border);
      color: var(--stone);
    }

    .btn-subtle:hover {
      background-color: var(--sand);
      color: var(--ink);
    }

    /* 主視覺簡介區 */
    main {
      flex: 1;
      padding: 56px 0 80px;
    }

    .hero {
      padding-bottom: 44px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background-color: var(--sage);
      color: var(--forest);
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.9rem, 3.6vw, 2.75rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
      max-width: 700px;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--stone);
      font-size: 1.05rem;
      max-width: 600px;
    }

    /* 區塊標題 */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 22px;
    }

    .section-header h2 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--ink);
    }

    .section-meta {
      color: var(--stone);
      font-size: 0.9rem;
    }

    /* 專案卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: #BDB3A2;
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
    }

    .chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background-color: var(--sage);
      color: var(--forest);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip-sand {
      background-color: var(--sand);
      color: var(--stone);
    }

    .card-desc {
      color: var(--stone);
      font-size: 0.95rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-actions .btn {
      padding: 9px 18px;
      font-size: 0.88rem;
    }

    /* 解鎖後的私人區塊 */
    #private-section {
      display: none;
      margin-bottom: 48px;
      padding: 28px;
      border-radius: var(--radius-card);
      background-color: var(--sand);
      border: 1px solid var(--border);
    }

    #private-section.active {
      display: block;
    }

    /* 密碼對話框 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(28, 25, 23, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 28px;
      transform: translateY(8px);
      transition: transform 0.22s ease;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal h3 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--stone);
      font-size: 0.92rem;
      margin-bottom: 18px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--forest);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.86rem;
      min-height: 20px;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 頁尾 */
    footer {
      background-color: var(--sand);
      border-top: 1px solid var(--border);
      padding: 28px 0;
      color: var(--stone);
      font-size: 0.88rem;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand-link" href="#">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>HIBOSSGEN</span>
        </a>
        <button id="open-private-btn" class="btn btn-subtle" type="button">
          私人入口
        </button>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="hero">
          <div class="hero-badge">
            <span class="brand-dot" aria-hidden="true"></span>
            <span>網站開發與資料整理</span>
          </div>
          <h1>把複雜的資料整理成<br />好讀、好用的日常工具</h1>
          <p>這裡收錄了 HIBOSSGEN 公開分享的網站與資料庫專案；未公開的個人實驗空間則可透過右上角私人入口進入。</p>
        </section>

        <!-- 輸入密碼解密後才會顯示的私人網站區塊 -->
        <section id="private-section" aria-live="polite">
          <div class="section-header">
            <h2>私人空間</h2>
            <button id="lock-private-btn" class="btn" type="button">鎖定並隱藏</button>
          </div>
          <div id="private-grid" class="grid"></div>
        </section>

        <!-- 公開網站展示區塊 -->
        <section>
          <div class="section-header">
            <h2>公開網站專案</h2>
            <span id="public-count" class="section-meta"></span>
          </div>
          <div id="public-grid" class="grid"></div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container footer-inner">
        <span>HIBOSSGEN</span>
        <span>私人入口採用瀏覽器端加密保護</span>
      </div>
    </footer>
  </div>

  <!-- 密碼輸入視窗 -->
  <div id="password-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title">進入私人空間</h3>
      <p>請輸入密碼，驗證後將顯示未公開的網站連結。</p>
      <form id="unlock-form">
        <input
          id="password-input"
          class="input-field"
          type="password"
          placeholder="請輸入密碼"
          autocomplete="current-password"
          required
        />
        <div id="unlock-error" class="error-msg"></div>
        <div class="modal-actions">
          <button id="cancel-modal-btn" class="btn" type="button">取消</button>
          <button id="submit-unlock-btn" class="btn btn-forest" type="submit">解鎖</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 公開網站清單（之後可隨時在這裡新增其他公開專案）
    const PUBLIC_SITES = [
      {
        name: "台灣中古車實價趨勢與世代資料庫",
        url: "https://bossliugen.github.io/Used_Cars9918/",
        description: "整理台灣中古車市場的實價走勢與各車型世代演進，方便買賣與研究時快速對照。",
        tag: "資料庫"
      }
    ];

    // 私人網站清單已使用 PBKDF2 + AES-GCM 加密（原始碼內不含明文網址或密碼）
    const ENCRYPTED_PRIVATE_DATA = {
      salt: "r8tmgEFpReRbiy+mQbT+/Q==",
      iv: "cbchKES+9uVWBHCj",
      data: "PUXAqxjDwtezW7yfQcV1R6VdVKVMFe/qadyT1wZjAoIBc3HGgZOQEJ+wW84ua6kBiOYOllAEkBfYQJJqIYV2mU9vKz6hgVT57xjaE+mVFdb3lebnB3WLAJRNovs7cwQ0Kj0DiZNfk7ORAChE2wMs45UGoWsN9ST3optaSsXLqstjCURXBAPtJIEo/WFHLsg5XPfaJLrg+cCDc5vtwLyhv12mpQJJPHglAD0F5ThAbtSV5Fs="
    };

    function createSiteCard(site, isPrivate = false) {
      const card = document.createElement("article");
      card.className = "card";

      const content = document.createElement("div");
      const top = document.createElement("div");
      top.className = "card-top";

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = site.name || "未命名專案";
      top.appendChild(title);

      if (site.tag) {
        const tag = document.createElement("span");
        tag.className = isPrivate ? "chip chip-sand" : "chip";
        tag.textContent = isPrivate ? "私人空間" : site.tag;
        top.appendChild(tag);
      }

      const desc = document.createElement("p");
      desc.className = "card-desc";
      desc.textContent = site.description || "";

      content.appendChild(top);
      content.appendChild(desc);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      if (site.url) {
        const visitLink = document.createElement("a");
        visitLink.className = "btn btn-forest";
        visitLink.href = site.url;
        visitLink.target = "_blank";
        visitLink.rel = "noopener noreferrer";
        visitLink.textContent = "前往網站";
        actions.appendChild(visitLink);
      }

      if (site.repo) {
        const repoLink = document.createElement("a");
        repoLink.className = "btn";
        repoLink.href = site.repo;
        repoLink.target = "_blank";
        repoLink.rel = "noopener noreferrer";
        repoLink.textContent = "原始碼";
        actions.appendChild(repoLink);
      }

      card.appendChild(content);
      card.appendChild(actions);
      return card;
    }

    function renderPublicSites() {
      const grid = document.getElementById("public-grid");
      const count = document.getElementById("public-count");
      grid.innerHTML = "";
      PUBLIC_SITES.forEach((site) => {
        grid.appendChild(createSiteCard(site, false));
      });
      count.textContent = `目前收錄 ${PUBLIC_SITES.length} 項公開專案`;
    }

    function fromBase64(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptPrivateSites(password) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error("目前瀏覽環境不支援加密解密功能，請透過安全連線開啟。");
      }

      const enc = new TextEncoder();
      const dec = new TextDecoder();
      const salt = fromBase64(ENCRYPTED_PRIVATE_DATA.salt);
      const iv = fromBase64(ENCRYPTED_PRIVATE_DATA.iv);
      const cipherBytes = fromBase64(ENCRYPTED_PRIVATE_DATA.data);

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plainBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        cipherBytes
      );

      return JSON.parse(dec.decode(plainBuffer));
    }

    const modal = document.getElementById("password-modal");
    const openBtn = document.getElementById("open-private-btn");
    const cancelBtn = document.getElementById("cancel-modal-btn");
    const lockBtn = document.getElementById("lock-private-btn");
    const unlockForm = document.getElementById("unlock-form");
    const submitBtn = document.getElementById("submit-unlock-btn");
    const passwordInput = document.getElementById("password-input");
    const errorEl = document.getElementById("unlock-error");
    const privateSection = document.getElementById("private-section");
    const privateGrid = document.getElementById("private-grid");

    function openModal() {
      errorEl.textContent = "";
      passwordInput.value = "";
      modal.classList.add("open");
      setTimeout(() => passwordInput.focus(), 60);
    }

    function closeModal() {
      modal.classList.remove("open");
      passwordInput.value = "";
      errorEl.textContent = "";
    }

    openBtn.addEventListener("click", openModal);
    cancelBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    lockBtn.addEventListener("click", () => {
      privateGrid.innerHTML = "";
      privateSection.classList.remove("active");
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "驗證中";

      try {
        const sites = await decryptPrivateSites(passwordInput.value);
        privateGrid.innerHTML = "";
        sites.forEach((site) => {
          privateGrid.appendChild(createSiteCard(site, true));
        });
        privateSection.classList.add("active");
        closeModal();
      } catch (err) {
        if (err && err.message && err.message.includes("加密解密")) {
          errorEl.textContent = err.message;
        } else {
          errorEl.textContent = "密碼不正確，請重新確認。";
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "解鎖";
      }
    });

    renderPublicSites();
  </script>
</body>
</html>
