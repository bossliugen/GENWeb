<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的網站開發展示 | Project Showcase</title>
  <style>
    :root {
      --bg: #070b16;
      --surface: rgba(17, 24, 46, 0.72);
      --surface-solid: #11182e;
      --border: rgba(255, 255, 255, 0.11);
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --private: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .aurora {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.45;
      background:
        radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.45), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.3), transparent 38%),
        radial-gradient(circle at 55% 85%, rgba(168, 85, 247, 0.28), transparent 42%);
      animation: auroraDrift 18s ease-in-out infinite alternate;
    }

    @keyframes auroraDrift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-2%, 2%, 0) scale(1.05); }
      100% { transform: translate3d(2%, -1.5%, 0) scale(1.02); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 72px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
      animation: fadeSlideDown 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #a5f3fc;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.28);
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px #22d3ee;
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    .brand h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #ffffff 0%, #a5b4fc 45%, #67e8f9 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShimmer 7s linear infinite;
    }

    @keyframes textShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .brand p {
      color: var(--muted);
      font-size: 0.96rem;
      margin-top: 6px;
    }

    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.26);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: rgba(165, 180, 252, 0.35);
      color: #fff;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.22) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.55s ease;
    }

    .btn-primary:hover:not(:disabled)::after {
      transform: translateX(120%);
    }

    .btn-private {
      border-color: rgba(245, 158, 11, 0.38);
      color: #fcd34d;
    }

    .btn-private:hover {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.7);
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.2);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
      gap: 12px;
    }

    .section-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .section-header span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      perspective: 900px;
    }

    .card {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease;
      animation: cardEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay, 0ms);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        340px circle at var(--mx, 50%) var(--my, 50%),
        rgba(99, 102, 241, 0.18),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      border-color: rgba(129, 140, 248, 0.55);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
    }

    .card.private-card {
      border-color: rgba(245, 158, 11, 0.32);
    }

    .card.private-card::before {
      background: radial-gradient(
        340px circle at var(--mx, 50%) var(--my, 50%),
        rgba(245, 158, 11, 0.18),
        transparent 65%
      );
    }

    .card.private-card:hover {
      border-color: rgba(245, 158, 11, 0.7);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: #c7d2fe;
      white-space: nowrap;
    }

    .tag.private-tag {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.35);
      color: #fcd34d;
    }

    .card-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .card-actions .btn {
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    #private-section {
      display: none;
      margin-bottom: 42px;
      padding: 24px;
      border-radius: var(--radius);
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.32);
      backdrop-filter: blur(12px);
    }

    #private-section.active {
      display: block;
      animation: fadeSlideDown 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 15, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      transform: translateY(14px) scale(0.96);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal.shake {
      animation: shakeX 0.38s ease;
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .modal h3 {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    .modal p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(7, 11, 22, 0.9);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input[type="password"]:focus {
      border-color: var(--private);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.85rem;
      min-height: 20px;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      #bg-canvas {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="container">
    <header>
      <div class="brand">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Live on GitHub Pages</span>
        </div>
        <h1>我的網站開發展示</h1>
        <p>這裡收錄了我開發的公開網站與線上資料庫</p>
      </div>
      <button id="open-private-btn" class="btn btn-private" type="button">
        🔒 私人入口
      </button>
    </header>

    <!-- 輸入密碼解密後才會顯示的私人網站區塊 -->
    <section id="private-section" aria-live="polite">
      <div class="section-header">
        <h2>🔓 私人未公開網站</h2>
        <button id="lock-private-btn" class="btn" type="button">鎖定並隱藏</button>
      </div>
      <div id="private-grid" class="grid"></div>
    </section>

    <!-- 公開網站展示區塊 -->
    <section>
      <div class="section-header">
        <h2>🌐 公開網站專案</h2>
        <span id="public-count"></span>
      </div>
      <div id="public-grid" class="grid"></div>
    </section>

    <footer>
      <span>Hosted on GitHub Pages</span>
      <span>私人網站清單已使用 AES-GCM 加密保護</span>
    </footer>
  </div>

  <!-- 密碼輸入 Modal -->
  <div id="password-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-box" class="modal">
      <h3 id="modal-title">🔒 進入私人網站清單</h3>
      <p>請輸入密碼以解密並顯示私人未公開網站連結。</p>
      <form id="unlock-form">
        <div class="input-group">
          <input
            id="password-input"
            type="password"
            placeholder="請輸入密碼..."
            autocomplete="current-password"
            required
          />
        </div>
        <div id="unlock-error" class="error-msg"></div>
        <div class="modal-actions">
          <button id="cancel-modal-btn" class="btn" type="button">取消</button>
          <button id="submit-unlock-btn" class="btn btn-primary" type="submit">解鎖</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 公開網站清單（之後可隨時在這裡新增其他公開專案）
    const PUBLIC_SITES = [
      {
        name: "台灣中古車實價趨勢與世代資料庫",
        url: "https://bossliugen.github.io/Used_Cars9918/",
        description: "提供台灣中古車實價趨勢查詢與各車型世代資料庫。",
        tag: "Database"
      }
    ];

    // 私人網站清單已使用 PBKDF2 + AES-GCM 加密（原始碼內不含明文網址或密碼）
    const ENCRYPTED_PRIVATE_DATA = {
      salt: "r8tmgEFpReRbiy+mQbT+/Q==",
      iv: "cbchKES+9uVWBHCj",
      data: "PUXAqxjDwtezW7yfQcV1R6VdVKVMFe/qadyT1wZjAoIBc3HGgZOQEJ+wW84ua6kBiOYOllAEkBfYQJJqIYV2mU9vKz6hgVT57xjaE+mVFdb3lebnB3WLAJRNovs7cwQ0Kj0DiZNfk7ORAChE2wMs45UGoWsN9ST3optaSsXLqstjCURXBAPtJIEo/WFHLsg5XPfaJLrg+cCDc5vtwLyhv12mpQJJPHglAD0F5ThAbtSV5Fs="
    };

    function attachCardInteractiveEffects(card) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty("--mx", `${x}px`);
        card.style.setProperty("--my", `${y}px`);

        const rotateY = ((x / rect.width) - 0.5) * 6;
        const rotateX = (0.5 - (y / rect.height)) * 6;
        card.style.transform = `translateY(-4px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "";
      });
    }

    function createSiteCard(site, isPrivate = false, index = 0) {
      const card = document.createElement("article");
      card.className = isPrivate ? "card private-card" : "card";
      card.style.setProperty("--delay", `${index * 80}ms`);

      const top = document.createElement("div");
      top.className = "card-top";

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = site.name || "未命名網站";
      top.appendChild(title);

      if (site.tag) {
        const tag = document.createElement("span");
        tag.className = isPrivate ? "tag private-tag" : "tag";
        tag.textContent = site.tag;
        top.appendChild(tag);
      }

      const desc = document.createElement("p");
      desc.className = "card-desc";
      desc.textContent = site.description || "";

      const body = document.createElement("div");
      body.appendChild(top);
      body.appendChild(desc);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      if (site.url) {
        const visitLink = document.createElement("a");
        visitLink.className = "btn btn-primary";
        visitLink.href = site.url;
        visitLink.target = "_blank";
        visitLink.rel = "noopener noreferrer";
        visitLink.textContent = "開啟網站 ↗";
        actions.appendChild(visitLink);
      }

      if (site.repo) {
        const repoLink = document.createElement("a");
        repoLink.className = "btn";
        repoLink.href = site.repo;
        repoLink.target = "_blank";
        repoLink.rel = "noopener noreferrer";
        repoLink.textContent = "原始碼";
        actions.appendChild(repoLink);
      }

      card.appendChild(body);
      card.appendChild(actions);
      attachCardInteractiveEffects(card);
      return card;
    }

    function renderPublicSites() {
      const grid = document.getElementById("public-grid");
      const count = document.getElementById("public-count");
      grid.innerHTML = "";
      PUBLIC_SITES.forEach((site, idx) => {
        grid.appendChild(createSiteCard(site, false, idx));
      });
      count.textContent = `共 ${PUBLIC_SITES.length} 個專案`;
    }

    function fromBase64(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptPrivateSites(password) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error("目前瀏覽環境不支援 Web Crypto API（請透過 GitHub Pages https:// 開啟）。");
      }

      const enc = new TextEncoder();
      const dec = new TextDecoder();
      const salt = fromBase64(ENCRYPTED_PRIVATE_DATA.salt);
      const iv = fromBase64(ENCRYPTED_PRIVATE_DATA.iv);
      const cipherBytes = fromBase64(ENCRYPTED_PRIVATE_DATA.data);

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const key = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const plainBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        key,
        cipherBytes
      );

      return JSON.parse(dec.decode(plainBuffer));
    }

    const modal = document.getElementById("password-modal");
    const modalBox = document.getElementById("modal-box");
    const openBtn = document.getElementById("open-private-btn");
    const cancelBtn = document.getElementById("cancel-modal-btn");
    const lockBtn = document.getElementById("lock-private-btn");
    const unlockForm = document.getElementById("unlock-form");
    const submitBtn = document.getElementById("submit-unlock-btn");
    const passwordInput = document.getElementById("password-input");
    const errorEl = document.getElementById("unlock-error");
    const privateSection = document.getElementById("private-section");
    const privateGrid = document.getElementById("private-grid");

    function openModal() {
      errorEl.textContent = "";
      passwordInput.value = "";
      modal.classList.add("open");
      setTimeout(() => passwordInput.focus(), 80);
    }

    function closeModal() {
      modal.classList.remove("open");
      passwordInput.value = "";
      errorEl.textContent = "";
    }

    function triggerModalShake() {
      modalBox.classList.remove("shake");
      void modalBox.offsetWidth;
      modalBox.classList.add("shake");
    }

    openBtn.addEventListener("click", openModal);
    cancelBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    lockBtn.addEventListener("click", () => {
      privateGrid.innerHTML = "";
      privateSection.classList.remove("active");
    });

    unlockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "解密中...";

      try {
        const sites = await decryptPrivateSites(passwordInput.value);
        privateGrid.innerHTML = "";
        sites.forEach((site, idx) => {
          privateGrid.appendChild(createSiteCard(site, true, idx));
        });
        privateSection.classList.add("active");
        closeModal();
      } catch (err) {
        if (err && err.message && err.message.includes("Web Crypto")) {
          errorEl.textContent = err.message;
        } else {
          errorEl.textContent = "密碼錯誤，無法解密私人網站資料。";
        }
        triggerModalShake();
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "解鎖";
      }
    });

    function initParticleCanvas() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      let width = 0;
      let height = 0;
      const mouse = { x: -9999, y: -9999 };
      const particles = [];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener("mouseleave", () => {
        mouse.x = -9999;
        mouse.y = -9999;
      });

      resize();
      const count = Math.min(55, Math.max(24, Math.floor((width * height) / 26000)));
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 1.6 + 1
        });
      }

      function tick() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(165, 180, 252, 0.55)";
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const q = particles[j];
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 130) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = `rgba(99, 102, 241, ${(1 - dist / 130) * 0.22})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          const mdx = p.x - mouse.x;
          const mdy = p.y - mouse.y;
          const mdist = Math.hypot(mdx, mdy);
          if (mdist < 160) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(34, 211, 238, ${(1 - mdist / 160) * 0.35})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        requestAnimationFrame(tick);
      }

      tick();
    }

    renderPublicSites();
    initParticleCanvas();
  </script>
</body>
</html>
